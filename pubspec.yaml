name: maldives_experts_customer
description: "Customer travel booking app for Maldives Experts."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.2.0
  dio: ^5.4.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10
  lottie: ^3.1.2
  intl: ^0.20.2
  connectivity_plus: ^6.0.3
  local_auth: ^2.2.0
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.3
  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.0.0
  equatable: ^2.0.5
  logger: ^2.3.0
  google_fonts: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/
    - assets/animations/
    - assets/fonts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
